name: Lint & Tests

on: [push, pull_request]

jobs:
  lint-and-tests:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12.3']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        # Optional/legacy runtime deps the tests exercise (sentencepiece is pinned in requirements.txt).
        pip install -r requirements.txt
        pip install pytest flake8 subword-nmt
    - name: Lint with flake8 (errors that break the code)
      run: |
        flake8 --count --select=E9,F63,F7,F82 --show-source .
    - name: Lint with flake8 (style, informational)
      run: |
        flake8 --exit-zero .
    - name: Unit tests
      run: |
        python -m pytest
