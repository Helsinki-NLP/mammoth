# ============================================================================
# Vocabulary Configuration
# ============================================================================
use_hf_tokenizer: true

src_vocab:
  en: /scratch/project_462000964/shared/hplt_bilingual/src_tokenizer/tokenizer.json

tgt_vocab:
  # Indo-Aryan
  hi: /scratch/project_462000964/shared/hplt_bilingual/hi-en.tmx/tgt_tokenizer/tokenizer.json
  bn: /scratch/project_462000964/shared/hplt_bilingual/bn-en.tmx/tgt_tokenizer/tokenizer.json
  gu: /scratch/project_462000964/shared/hplt_bilingual/gu-en.tmx/tgt_tokenizer/tokenizer.json
  kn: /scratch/project_462000964/shared/hplt_bilingual/kn-en.tmx/tgt_tokenizer/tokenizer.json
  # Slavic + Esperanto
  be: /scratch/project_462000964/shared/hplt_bilingual/be-en.tmx/tgt_tokenizer/tokenizer.json
  bs: /scratch/project_462000964/shared/hplt_bilingual/bs-en.tmx/tgt_tokenizer/tokenizer.json
  hr: /scratch/project_462000964/shared/hplt_bilingual/hr-en.tmx/tgt_tokenizer/tokenizer.json
  eo: /scratch/project_462000964/shared/hplt_bilingual/eo-en.tmx/tgt_tokenizer/tokenizer.json
  # Semitic + Iranian + Bantu
  ar: /scratch/project_462000964/shared/hplt_bilingual/ar-en.tmx/tgt_tokenizer/tokenizer.json
  he: /scratch/project_462000964/shared/hplt_bilingual/he-en.tmx/tgt_tokenizer/tokenizer.json
  fa: /scratch/project_462000964/shared/hplt_bilingual/fa-en.tmx/tgt_tokenizer/tokenizer.json
  sw: /scratch/project_462000964/shared/hplt_bilingual/sw-en.tmx/tgt_tokenizer/tokenizer.json
  # Mixed (Isolates + Uralic + Romance + Germanic)
  eu: /scratch/project_462000964/shared/hplt_bilingual/eu-en.tmx/tgt_tokenizer/tokenizer.json
  fi: /scratch/project_462000964/shared/hplt_bilingual/fi-en.tmx/tgt_tokenizer/tokenizer.json
  gl: /scratch/project_462000964/shared/hplt_bilingual/gl-en.tmx/tgt_tokenizer/tokenizer.json
  is: /scratch/project_462000964/shared/hplt_bilingual/is-en.tmx/tgt_tokenizer/tokenizer.json


src_seq_length: 256
tgt_seq_length: 256
max_length: 256

# ============================================================================
# Denoising Transform Parameters
# ============================================================================
denoising_objective: bart
mask_ratio: 0.2              # Fraction of tokens to mask
mask_length: span-poisson    # Options: 'subword', 'word', 'span-poisson'
poisson_lambda: 3.0          # Lambda for span length distribution
replace_length: 1            # -1: keep N tokens, 0: remove all, 1: single mask per span

# ============================================================================
# Model Architecture - Shared Encoder + Language-Specific Decoders
# ============================================================================
# Encoder: Single stack [22] = 22 layers total
#   All 22 layers shared across all 16 GPUs (synchronized via All-Reduce)
enc_layers: [22]

# Decoder: Single stack [6] = 6 layers total
#   All 6 layers are language-specific (16 separate decoders, no sharing)
dec_layers: [6]

model_dim: 768               # Transformer model dimension
dropout: 0.1                 # Dropout rate
model_dtype: bf16            # Use bfloat16 precision
model_type: modernbert
# ============================================================================
# x-transformers Specific Options
# ============================================================================
x_transformers_opts:
  # Attention configuration
  heads: 12                          # Number of attention heads
  attn_flash: true                   # Flash attention 2.0
  attn_dropout: 0.0                  # No attention dropout
  attn_use_unpadding: true           # ModernBERT-style unpadding for efficiency
  attn_fused_qkv: true              # Use fused QKV optimizations

  # Sliding window attention (ModernBERT feature)
  sliding_window: 128                # Local attention window (±64 tokens) (Encoder only)
  global_attn_every_n_layers: 3      # Global attention every 3 layers (Encoder only)

  # RoPE (Rotary Position Embeddings)
  rotary_pos_emb: true               # Use RoPE instead of absolute positions
  global_rope_theta: 160000.0        # RoPE base for global attention layers (Encoder only)
  local_rope_theta: 10000.0          # RoPE base for local attention layers (Encoder only)

  # Feed-forward network (GLU with bias-free architecture)
  ff_mult: 1.5                       # FFN dimension = 1.5 * model_dim = 1152
  ff_glu: true                       # Use GeGLU activation
  ff_dropout: 0.0                    # No FFN dropout
  ff_no_bias: true                   # Bias-free architecture

  # Normalization
  pre_norm: true                     # Pre-Layer Normalization (ModernBERT style)
  post_emb_norm: true                # Normalize after embeddings
  # post_emb_norm_bias: false          # Bias-free normalization
  # layernorm_bias: false              # Bias-free LayerNorm

  # Position embeddings
  use_abs_pos_emb: false             # No absolute positions (using RoPE)
  tie_embedding: false               # Don't tie input/output embeddings

# ============================================================================
# Training Configuration
# ============================================================================
train_steps: 62500
accum_count: [1]                  # Gradient accumulation steps
batch_size: 16                     # Per-GPU batch size (in sentences)
batch_type: sents                 # Batch by sentences
normalization: tokens             # Normalize gradients by token count
valid_batch_size: 16               # Validation batch size
valid_steps: 10000                # Validation frequency
valid_metrics: [bleu]             # Validation metrics
# valid_at_start: true              # Run validation before training
save_checkpoint_steps: 5000       # Checkpoint saving frequency
keep_checkpoint: 5                # Number of checkpoints to keep

# ============================================================================
# Optimizer Settings
# ============================================================================
optim: adafactor
learning_rate: 0.001    
# adam_beta1: 0.9
# adam_beta2: 0.999
weight_decay: 0.0
max_grad_norm: 1.0                # Gradient clipping per component

# Learning rate scheduling
warmup_steps: 5000
decay_method: linear_warmup
learning_rate_decay: 0
start_decay_steps: 0

# ============================================================================
# Distributed Training Configuration (8-node, 16 GPU setup)
# ============================================================================
world_size: 16                    # Total number of GPUs across all nodes
gpu_ranks: [0, 1]                 # GPUs per node (2 GPUs per node)
n_nodes: 8                        # Number of nodes
task_distribution_strategy: weighted_sampling

# ============================================================================
# Logging and Monitoring
# ============================================================================
log_model_structure: false       # Log model structure at startup
report_every: 100                 # Report training stats every N steps
report_training_accuracy: true    # Report training accuracy

# ============================================================================
# Miscellaneous
# ============================================================================
seed: 42                          # Random seed for reproducibility
reset_optim: all                  # Reset optimizer state when loading checkpoint
label_smoothing: 0.1              # Label smoothing for better generalization

# Model checkpoint path
save_model: /scratch/project_462000964/members/wangchao/training/eight_nodes/models/16gpu
