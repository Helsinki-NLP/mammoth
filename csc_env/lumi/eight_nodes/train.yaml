# Training configuration for 8-node setup with 16 GPUs total (2 GPUs per node)
# Architecture: Shared encoder + 16 language-specific decoders
# Node 0: GPUs 0-1 (hi, bn) | Node 1: GPUs 2-3 (gu, kn) | Node 2: GPUs 4-5 (be, bs) | Node 3: GPUs 6-7 (hr, eo)
# Node 4: GPUs 8-9 (ar, he) | Node 5: GPUs 10-11 (fa, sw) | Node 6: GPUs 12-13 (eu, fi) | Node 7: GPUs 14-15 (gl, is)

# Task Configuration - 16 tasks distributed across 8 nodes (16 GPUs total)
tasks:
  # ============================================================================
  # NODE 0 - Indo-Aryan Languages Part 1 (GPUs 0-1)
  # ============================================================================
  task_en_hi:
    src_tgt: "en-hi"
    weight: 1.0
    introduce_at_training_step: 0
    node_gpu: "0:0"  # Node 0, GPU 0 (Global GPU 0)
    enc_sharing_group: ["shared"]  # Shared encoder
    dec_sharing_group: ["hi"]      # Language-specific decoder
    transforms: [prefix, denoising, filtertoolong]
    path_src: /scratch/project_462000964/shared/hplt_bilingual/hi-en.tmx/train_en.txt
    path_tgt: /scratch/project_462000964/shared/hplt_bilingual/hi-en.tmx/train_hi.txt
    path_valid_src: /scratch/project_462000964/shared/hplt_bilingual/hi-en.tmx/val_en.txt
    path_valid_tgt: /scratch/project_462000964/shared/hplt_bilingual/hi-en.tmx/val_hi.txt
    src_prefix: "<to_hi>"
    tgt_prefix: "<hi>"

  task_en_bn:
