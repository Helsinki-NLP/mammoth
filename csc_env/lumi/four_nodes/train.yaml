# ============================================================================
# Vocabulary Configuration
# ============================================================================
use_hf_tokenizer: true

src_vocab:
  en: /scratch/project_462000964/members/wangchao/training/four_nodes/tokenizer.json

tgt_vocab:
  # Indo-Aryan
  hi: /scratch/project_462000964/members/wangchao/training/four_nodes/tokenizer.json
  bn: /scratch/project_462000964/members/wangchao/training/four_nodes/tokenizer.json
  gu: /scratch/project_462000964/members/wangchao/training/four_nodes/tokenizer.json
  kn: /scratch/project_462000964/members/wangchao/training/four_nodes/tokenizer.json
  # Slavic + Esperanto
  be: /scratch/project_462000964/members/wangchao/training/four_nodes/tokenizer.json
  bs: /scratch/project_462000964/members/wangchao/training/four_nodes/tokenizer.json
  hr: /scratch/project_462000964/members/wangchao/training/four_nodes/tokenizer.json
  eo: /scratch/project_462000964/members/wangchao/training/four_nodes/tokenizer.json
  # Semitic + Iranian + Bantu
  ar: /scratch/project_462000964/members/wangchao/training/four_nodes/tokenizer.json
  he: /scratch/project_462000964/members/wangchao/training/four_nodes/tokenizer.json
  fa: /scratch/project_462000964/members/wangchao/training/four_nodes/tokenizer.json
  sw: /scratch/project_462000964/members/wangchao/training/four_nodes/tokenizer.json
  # Mixed (Isolates + Uralic + Romance + Germanic)
  eu: /scratch/project_462000964/members/wangchao/training/four_nodes/tokenizer.json
  fi: /scratch/project_462000964/members/wangchao/training/four_nodes/tokenizer.json
  gl: /scratch/project_462000964/members/wangchao/training/four_nodes/tokenizer.json
  is: /scratch/project_462000964/members/wangchao/training/four_nodes/tokenizer.json


src_seq_length: 254
tgt_seq_length: 254
max_length: 256

# ============================================================================
# Denoising Transform Parameters
# ============================================================================
# denoising_objective: bart
# mask_ratio: 0.2              # Fraction of tokens to mask
# mask_length: span-poisson    # Options: 'subword', 'word', 'span-poisson'
# poisson_lambda: 3.0          # Lambda for span length distribution
# replace_length: 1            # -1: keep N tokens, 0: remove all, 1: single mask per span

# ============================================================================
# Model Architecture - Hierarchical Multi-Stack
# ============================================================================
# Encoder: 2 stacks [6, 3] = 9 layers total
#   Stack 0 (6 layers): Shared universal features across all 16 GPUs
#   Stack 1 (3 layers): Language family-specific features (4 families)
enc_layers: [6, 3]

# Decoder: 2 stacks [2, 4] = 6 layers total
#   Stack 0 (2 layers): Shared low-level decoding across all 16 GPUs
#   Stack 1 (4 layers): Language-specific decoding (16 separate decoders)
dec_layers: [2, 4]

model_dim: 768               # Transformer model dimension
dropout: 0.1                 # Dropout rate

# ============================================================================
# x-transformers Specific Options
# ============================================================================
x_transformers_opts:
  # attn_flash: true           # Flash attention (not supported on V100)
  rotary_pos_emb: false         # Use rotary positional embeddings
  tie_embedding: false         # Tie input/output embeddings
  heads: 12                    # Number of attention heads
  pre_norm: false              # Use post-norm (standard transformer)
  post_emb_norm: true          # Normalize after embeddings
  post_emb_norm_bias: true     # Add bias to post-embedding norm
  attn_dropout: 0.1            # Attention dropout
  ff_dropout: 0.1              # Feed-forward dropout
  layernorm_bias: true         # Use bias in layer normalization
  use_abs_pos_emb: true        # Use absolute positional embeddings

# ============================================================================
# Training Configuration
# ============================================================================
train_steps: 62500
accum_count: [1]                  # Gradient accumulation steps
batch_size: 16                     # Per-GPU batch size (in sentences)
batch_type: sents                 # Batch by sentences
normalization: tokens             # Normalize gradients by token count
valid_batch_size: 16               # Validation batch size
valid_steps: 10000                # Validation frequency
valid_metrics: [bleu]             # Validation metrics
# valid_at_start: true              # Run validation before training
save_checkpoint_steps: 5000       # Checkpoint saving frequency
keep_checkpoint: 5                # Number of checkpoints to keep

# ============================================================================
# Optimizer Settings
# ============================================================================
optim: adamw
learning_rate: 0.0001
adam_beta1: 0.9
adam_beta2: 0.999
weight_decay: 0.0
max_grad_norm: 1.0                # Gradient clipping per component

# Learning rate scheduling
warmup_steps: 5000
decay_method: linear_warmup
learning_rate_decay: 0
start_decay_steps: 0

# ============================================================================
# Distributed Training Configuration (4-node, 16 GPU setup)
# ============================================================================
world_size: 16                    # Total number of GPUs across all nodes
gpu_ranks: [0, 1, 2, 3]           # GPUs per node
n_nodes: 4                        # Number of nodes
task_distribution_strategy: weighted_sampling

# ============================================================================
# Logging and Monitoring
# ============================================================================
log_model_structure: false       # Log model structure at startup
report_every: 100                 # Report training stats every N steps
report_training_accuracy: true    # Report training accuracy

# ============================================================================
# Miscellaneous
# ============================================================================
seed: 42                          # Random seed for reproducibility
reset_optim: all                  # Reset optimizer state when loading checkpoint
label_smoothing: 0.1              # Label smoothing for better generalization

# Model checkpoint path
save_model: /scratch/project_462000964/members/wangchao/training/four_nodes/models/16gpu
