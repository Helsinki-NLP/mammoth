# Training configuration for 4-node setup with 16 GPUs total (4 GPUs per node)
# Hierarchical Architecture: Shared base encoder + Language family-specific upper encoder
# Node 0: GPUs 0-3 (Indo-Aryan) | Node 1: GPUs 4-7 (Slavic) | Node 2: GPUs 8-11 (Semitic+Iranian) | Node 3: GPUs 12-15 (Mixed)

# Task Configuration - 16 tasks distributed across 4 nodes (16 GPUs total)
tasks:
  # ============================================================================
  # NODE 0 - Indo-Aryan Languages (GPUs 0-3)
  # ============================================================================
  task_en_hi:
    src_tgt: "en-hi"
    weight: 1.0
    introduce_at_training_step: 0
    node_gpu: "0:0"  # Node 0, GPU 0 (Global GPU 0)
    enc_sharing_group: ["shared", "indo_aryan"]  # Stack 0: shared, Stack 1: indo-aryan
    dec_sharing_group: ["shared_low", "hi"]      # Stack 0: shared, Stack 1: language-specific
    transforms: [prefix, filtertoolong]
    path_src: /scratch/project_462000964/shared/hplt_bilingual/hi-en.tmx/train_en.txt
    path_tgt: /scratch/project_462000964/shared/hplt_bilingual/hi-en.tmx/train_hi.txt
    path_valid_src: /scratch/project_462000964/shared/hplt_bilingual/hi-en.tmx/val_en.txt
    path_valid_tgt: /scratch/project_462000964/shared/hplt_bilingual/hi-en.tmx/val_hi.txt
    src_prefix: "<to_hi>"
    tgt_prefix: "<hi>"

  task_en_bn:
