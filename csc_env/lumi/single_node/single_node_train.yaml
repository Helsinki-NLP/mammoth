# Training configuration for converted BART model in Mammoth
# Generated from hf_converter.py specifications

# Task Configuration
tasks:
  bart_translation:
    src_tgt: "en-es"  # Source-target language pair
    weight: 1.0       # Task weight for sampling
    introduce_at_training_step: 0
    node_gpu: 0:0   # Single GPU configuration
    enc_sharing_group: ["en"]
    dec_sharing_group: ["es"]
    transforms: [huggingface]
    path_src: /scratch/project_462000964/members/wangchao/training/data/en_train.txt
    path_tgt: /scratch/project_462000964/members/wangchao/training/data/es_train.txt
    path_valid_src: /scratch/project_462000964/members/wangchao/training/data/en_val.txt
    path_valid_tgt: /scratch/project_462000964/members/wangchao/training/data/es_val.txt
    

src_seq_length: 128               
tgt_seq_length: 128  
src_hf_model_name: /scratch/project_462000964/members/wangchao/training/hf_models/en_es
# Model Architecture Options
enc_layers: [6]                   # Encoder layers
dec_layers: [6]                   # Decoder layers



# # x-transformers specific options
# x_transformers_opts:
#   attn_flash: true                # flash attention (not supported on V100)


# Training Configuration

# Training specifics
train_steps: 25000
accum_count: [1]                  # gradient accumulation
batch_size: 16
batch_type: sents                    # adjust based on GPU memory
valid_batch_size: 8          # validation batch size
# max_train_steps: 1000          # maximum training steps
valid_steps: 5000               # validation frequency    
valid_metrics: [bleu]              
save_checkpoint_steps: 5000       # checkpoint saving frequency
keep_checkpoint: 5               # number of checkpoints to keep

# Optimizer settings (from create_opts)
optim: adamw
learning_rate: 0.00001
adam_beta1: 0.9
adam_beta2: 0.999
weight_decay: 0.0
max_grad_norm: 1.0

# Learning rate scheduling
warmup_steps: 2000
decay_method: linear_warmup
learning_rate_decay: 0
start_decay_steps: 0

# Distributed training (single GPU setup)
world_size: 1
gpu_ranks: [0]
task_distribution_strategy: weighted_sampling
node_rank: 0

# Data Configuration

# Vocabulary files (generated by converter)
src_vocab:
  en: /scratch/project_462000964/members/wangchao/training/train_ft/src_vocab_en.txt
tgt_vocab:
  es: /scratch/project_462000964/members/wangchao/training/train_ft/tgt_vocab_es.txt
src_vocab_size: 100000
tgt_vocab_size: 100000
             

# Logging and Monitoring

log_model_structure: false         # log model structure
# tensorboard: true                 # enable tensorboard logging
# tensorboard_log_dir: ./logs     # tensorboard log directory
report_every: 100
report_training_accuracy: true     # reporting accuracy

# Miscellaneous
seed: 42                            # random seed
train_from: /scratch/project_462000964/members/wangchao/training/converted_models/en_es/   # path to pretrained model (null for from scratch)
reset_optim: all               # reset optimizer state
#TODO: ask joseph about it 

# Model saving
# save_model: /scratch/project_462000964/members/wangchao/training/train_ft/models/en_es # model save path
save_model: ./models/trained/bart # model save path