# Training configuration for 4-GPU setup with shared encoder and 4 language-specific decoders

# Task Configuration - 4 tasks for 4 different target languages
tasks:
  task_en_ar:
    src_tgt: "en-ar"
    weight: 1.0
    introduce_at_training_step: 0
    node_gpu: 0:0  # GPU 0
    enc_sharing_group: ["shared"]  # Shared encoder across all tasks
    dec_sharing_group: ["ar"]      # German-specific decoder
    transforms: [sentencepiece,prefix,denoising,filtertoolong]
    path_src: /scratch/project_2005099/data/hplt_bilingual/ar-en.tmx/train_en.txt
    path_tgt: /scratch/project_2005099/data/hplt_bilingual/ar-en.tmx/train_ar.txt
    path_valid_src: /scratch/project_2005099/data/hplt_bilingual/ar-en.tmx/val_en.txt
    path_valid_tgt: /scratch/project_2005099/data/hplt_bilingual/ar-en.tmx/val_ar.txt
    src_prefix: "<to_ar>"
    tgt_prefix: "<ar>"


  task_en_eu:
    src_tgt: "en-eu"
    weight: 1.0
    introduce_at_training_step: 0
    node_gpu: 0:1  # GPU 1
    enc_sharing_group: ["shared"]  # Shared encoder across all tasks
    dec_sharing_group: ["eu"]      # French-specific decoder
    transforms: [sentencepiece, prefix,denoising,filtertoolong]
    path_src: /scratch/project_2005099/data/hplt_bilingual/eu-en.tmx/train_en.txt
    path_tgt: /scratch/project_2005099/data/hplt_bilingual/eu-en.tmx/train_eu.txt
    path_valid_src: /scratch/project_2005099/data/hplt_bilingual/eu-en.tmx/val_en.txt
    path_valid_tgt: /scratch/project_2005099/data/hplt_bilingual/eu-en.tmx/val_eu.txt
    src_prefix: "<to_eu>"
    tgt_prefix: "<eu>"


  task_en_fi:
    src_tgt: "en-fi"
    weight: 1.0
    introduce_at_training_step: 0
    node_gpu: 0:2  # GPU 2
    enc_sharing_group: ["shared"]  # Shared encoder across all tasks
    dec_sharing_group: ["fi"]      # Spanish-specific decoder
    transforms: [sentencepiece, prefix,denoising,filtertoolong]
    path_src: /scratch/project_2005099/data/hplt_bilingual/fi-en.tmx/train_en.txt
    path_tgt: /scratch/project_2005099/data/hplt_bilingual/fi-en.tmx/train_fi.txt
    path_valid_src: /scratch/project_2005099/data/hplt_bilingual/fi-en.tmx/val_en.txt
    path_valid_tgt: /scratch/project_2005099/data/hplt_bilingual/fi-en.tmx/val_fi.txt
    src_prefix: "<to_fi>"
    tgt_prefix: "<fi>"


  task_en_he:
    src_tgt: "en-he"
    weight: 1.0
    introduce_at_training_step: 0
    node_gpu: 0:3  # GPU 3
    enc_sharing_group: ["shared"]  # Shared encoder across all tasks
    dec_sharing_group: ["he"]      # Italian-specific decoder
    transforms: [sentencepiece, prefix,denoising,filtertoolong]
    path_src: /scratch/project_2005099/data/hplt_bilingual/he-en.tmx/train_en.txt
    path_tgt: /scratch/project_2005099/data/hplt_bilingual/he-en.tmx/train_he.txt
    path_valid_src: /scratch/project_2005099/data/hplt_bilingual/he-en.tmx/val_en.txt
    path_valid_tgt: /scratch/project_2005099/data/hplt_bilingual/he-en.tmx/val_he.txt
    src_prefix: "<to_he>"
    tgt_prefix: "<he>"


# Vocabulary files for all languages
src_vocab:
  en: /scratch/project_2005099/members/chaowang/training/one_node/vocab/joint_spm_en_multi.vocab
tgt_vocab:
  ar: /scratch/project_2005099/members/chaowang/training/one_node/vocab/joint_spm_en_multi.vocab
  eu: /scratch/project_2005099/members/chaowang/training/one_node/vocab/joint_spm_en_multi.vocab
  fi: /scratch/project_2005099/members/chaowang/training/one_node/vocab/joint_spm_en_multi.vocab
  he: /scratch/project_2005099/members/chaowang/training/one_node/vocab/joint_spm_en_multi.vocab
src_vocab_size: 100000             
tgt_vocab_size: 100000
             
# Subword configuration for sentencepiece
src_subword_type: sentencepiece
tgt_subword_type: sentencepiece
src_subword_model: /scratch/project_2005099/members/chaowang/training/one_node/vocab/joint_spm_en_multi.model
tgt_subword_model: /scratch/project_2005099/members/chaowang/training/one_node/vocab/joint_spm_en_multi.model


src_seq_length: 256               
tgt_seq_length: 256
max_length: 256

# Denoising transform parameters
denoising_objective: bart
mask_ratio: 0.2              # Fraction of tokens to mask
mask_length: span-poisson    # Options: 'subword', 'word', 'span-poisson'
poisson_lambda: 3.0          # Lambda for span length distribution
replace_length: 1            # -1: keep N tokens, 0: remove all, 1: single mask per span

# Model Architecture Options
enc_layers: [9]                   # Shared encoder layers
dec_layers: [3]                   # Decoder layers for each language-specific decoder
model_dim: 768                    # Transformer model dimension
dropout: 0.1                      # Dropout rate

# x-transformers specific options
x_transformers_opts:
  # attn_flash: true            # Flash attention (not supported on V100)
  rotary_pos_emb: true          # Use rotary positional embeddings
  tie_embedding: false           # Tie input/output embeddings
  heads: 12   
  pre_norm: false
  post_emb_norm: true
  post_emb_norm_bias: true
  attn_dropout: 0.1
  ff_dropout: 0.1
  layernorm_bias: true
  use_abs_pos_emb: true

# Training Configuration

# Training specifics
train_steps: 62500
accum_count: [1]                  # gradient accumulation
batch_size: 16
batch_type: sents                 # adjust based on GPU memory
valid_batch_size: 16              # validation batch size
valid_steps: 10000
valid_metrics: [bleu]
valid_at_start: true             # validation frequency
save_checkpoint_steps: 10000      # checkpoint saving frequency
keep_checkpoint: 5                # number of checkpoints to keep

# Optimizer settings 
optim: adamw
learning_rate: 0.0001
adam_beta1: 0.9
adam_beta2: 0.999
weight_decay: 0.0
max_grad_norm: 1.0

# Learning rate scheduling
warmup_steps: 5000
decay_method: linear_warmup
learning_rate_decay: 0
start_decay_steps: 0

# Distributed training (4 GPU setup)
world_size: 4
gpu_ranks: [0, 1, 2, 3]
task_distribution_strategy: weighted_sampling
node_rank: 0

# Logging and Monitoring
log_model_structure: false         # log model structure
# tensorboard: true                 # enable tensorboard logging
# tensorboard_log_dir: ./logs     # tensorboard log directory
report_every: 100
report_training_accuracy: true     # reporting accuracy

# Miscellaneous
seed: 42                            # random seed
reset_optim: all                    # reset optimizer state
# Model saving
save_model: ./models/en_multi  # model save path

label_smoothing: 0.1              # Label smoothing for better generalization