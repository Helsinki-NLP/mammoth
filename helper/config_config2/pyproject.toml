[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "config-config2"
version = "0.1.0"
requires-python = ">=3.8"

[project.scripts]
config-config2 = "config_config2.main:main"

[tool.setuptools]
packages = ["config_config2"]

# 👇 this is the crucial mapping:
[tool.setuptools.package-dir]
config_config2 = "."


