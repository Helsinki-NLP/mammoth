# ============================================================================
# Denoising Transform Parameters (BART-style)
# ============================================================================
# denoising_objective: bart
# mask_ratio: 0.15              # Fraction of tokens to mask
# mask_length: span-poisson     # Span masking with Poisson distribution
# poisson_lambda: 3.0           # Average span length
# replace_length: 1             # Replace span with single mask token

# ============================================================================
# Model Architecture
# ============================================================================
model_dtype: bf16
enc_layers: [12]
dec_layers: [18]                     # num_hidden_layers


enc_model_dim: 768                   # encoder hidden dim (custom, not from HF)
dec_model_dim: 640                   # hidden_size from config.json

# Sliding window attention (Gemma3-style dual RoPE)
dec_sliding_window: 512              # sliding_window
dec_global_attn_every_n_layers: 6   # _sliding_window_pattern (full attn at layers 5,11,17)
dec_global_rope_theta: 1000000.0    # rope_theta
dec_local_rope_theta: 10000.0       # rope_local_base_freq
enc_sliding_window: -1              # full attention for encoder

# ============================================================================
# x-transformers Options
# ============================================================================
x_transformers_opts:
  attn_flash: true
  use_abs_pos_emb: false 

  # --- Decoder: mirrors Gemma3 exactly ---
  dec_heads: 4                       # num_attention_heads
  dec_attn_dim_head: 256             # head_dim
  dec_attn_dropout: 0.0
  dec_attn_qk_norm: true             # QK normalization
  dec_attn_qk_norm_dim_scale: true   # learnable per-element scale
  dec_attn_kv_heads: 1               # num_key_value_heads (MQA)
  dec_ff_mult: 3.2                   # intermediate_size / hidden_size = 2048 / 640
  dec_ff_dropout: 0.0
  dec_ff_glu: true                   # GeGLU activation
  dec_ff_no_bias: true
  dec_rotary_pos_emb: true
  dec_use_rmsnorm: true
  dec_sandwich_norm: true            # pre+post norm per layer (Gemma3)
  dec_post_emb_norm: false
  dec_scaled_embeddings: true        # multiply embeddings by sqrt(hidden_size)
  dec_max_seq_len: 32768             # max_position_embeddings
  dec_cross_attn_dim_context: 768    # must equal enc_model_dim

  # --- Encoder: standard transformer (not from HF config) ---
  enc_heads: 8
  enc_attn_dim_head: 96 # enc_model_dim // enc_heads 
  enc_ff_mult: 4.0
  enc_ff_glu: true
  enc_ff_no_bias: true
  enc_rotary_pos_emb: true
  enc_post_emb_norm: true
  enc_scaled_embeddings: false
  enc_max_seq_len: 512


# ============================================================================
# Training Configuration
# ============================================================================
train_steps: 60000
accum_count: [4]
lookahead_minibatches: 4                    # Gradient accumulation (effective batch = 4 * 32 = 128)
batch_size: 16384                        # Per-GPU batch size
batch_type: tokens                    # Batch by sentences
queue_size: 80
normalization: tokens                # Normalize gradients by token count
valid_batch_size: 16                 # Validation batch size
valid_steps: 12000                    # Validation frequency
valid_metrics: [bleu,chrf]                # Validation metrics

save_strategy: best_and_last
metric_for_best_model: chrf
keep_checkpoint: 3                   # Keep last 5 checkpoints

# ============================================================================
# Optimizer Settings - AdamW with warmup
# ============================================================================
optim: adamw
learning_rate: 8e-4              # Peak learning rate
adam_beta1: 0.9
adam_beta2: 0.999
weight_decay: 0.01                   # Weight decay for regularization
max_grad_norm: 1.0                   # Gradient clipping

# Learning rate scheduling
warmup_steps: 6000                   
decay_method: linear_warmup          # Linear warmup + cosine decay
learning_rate_decay: 1.0             # Full decay after warmup
start_decay_steps: 30000              # Start decay after warmup

# ============================================================================
# Distributed Training (Single GPU)
# ============================================================================
world_size: 1
gpu_ranks: [0]
node_rank: 0
task_distribution_strategy: weighted_sampling

# ============================================================================
# Logging and Monitoring
# ============================================================================
log_model_structure: false           # Log model structure at startup
report_every: 100                    # Report every 100 steps
report_training_accuracy: true       # Report training accuracy
tensorboard: true
tensorboard_log_dir: ./tensorboard_logs

# ============================================================================
# Miscellaneous
# ============================================================================
seed: 42                             # Random seed
reset_optim: all                     # Continue training steps and the optimizer state


# Model saving
save_model: /scratch/project_462000964/members/wangchao/training/22apr26/gemma3/model/
