# Task Configuration - Single language pair
tasks:
  task_en_fi:
    src_tgt: "en-fi"
    weight: 1.0
    introduce_at_training_step: 0
    node_gpu: 0:0
    enc_sharing_group: ["shared"]
    dec_sharing_group: ["fi"]
    transforms: [filtertoolong]
    path_src: /scratch/project_462000964/shared/hplt_bilingual/fi-en.tmx/train_en.txt
    path_tgt: /scratch/project_462000964/shared/hplt_bilingual/fi-en.tmx/train_fi.txt
    path_valid_src: /scratch/project_462000964/shared/hplt_bilingual/fi-en.tmx/val_en.txt
    path_valid_tgt: /scratch/project_462000964/shared/hplt_bilingual/fi-en.tmx/val_fi.txt

# ============================================================================
# Vocabulary Configuration - HuggingFace Tokenizer
# ============================================================================
use_hf_tokenizer: true
# override_checkpoint_vocab: true # only works when 'train_from' is used

src_vocab:
  en: /scratch/project_462000964/members/wangchao/training/hf_models/modernbert/tokenizer.json

tgt_vocab:
  fi: /scratch/project_462000964/shared/hplt_bilingual/fi-en.tmx/tgt_tokenizer/tokenizer.json

src_seq_length: 256
tgt_seq_length: 256
max_length: 256  # Mammoth adds bos and eos token to training data.

# ============================================================================
# Denoising Transform Parameters (BART-style)
# ============================================================================
# denoising_objective: bart
# mask_ratio: 0.15              # Fraction of tokens to mask
# mask_length: span-poisson     # Span masking with Poisson distribution
# poisson_lambda: 3.0           # Average span length
# replace_length: 1             # Replace span with single mask token

# ============================================================================
# Model Architecture - ModernBERT Features
# ============================================================================
enc_layers: [22]
dec_layers: [6]

model_dim: 768                # Hidden dimension
model_dtype: bf16            # BFloat16 for better training stability
model_type: text
dropout: [0.0]                # ModernBERT uses no dropout during training

# ============================================================================
# x-transformers Options - ModernBERT Configuration
# ============================================================================
x_transformers_opts:
  # Attention configuration
  heads: 12                          # Number of attention heads
  attn_flash: true                   # Flash attention 2.0
  attn_dropout: 0.0                  # No attention dropout
  # attn_use_unpadding: true           # ModernBERT-style unpadding for efficiency
  # attn_fused_qkv: true

  # # Sliding window attention (ModernBERT feature)
  # sliding_window: 128                # Local attention window (±64 tokens) (Encoder only)
  # global_attn_every_n_layers: 3      # Global attention every 3 layers (Encoder only)

  # RoPE (Rotary Position Embeddings)
  rotary_pos_emb: true               # Use RoPE instead of absolute positions
  # global_rope_theta: 160000.0      # RoPE base for global attention layers (Encoder only)
  # local_rope_theta: 10000.0        # RoPE base for local attention layers (Encoder only)

  # Feed-forward network (GLU with bias-free architecture)
  ff_mult: 1.5                       # FFN dimension = 1.5 * model_dim = 1152
  ff_glu: true                       # Use GeGLU activation
  ff_dropout: 0.0                    # No FFN dropout
  ff_no_bias: true                   # Bias-free architecture

  # Normalization
  pre_norm: true                     # Pre-Layer Normalization (ModernBERT style)
  post_emb_norm: true                # Normalize after embeddings
  # post_emb_norm_bias: false          # Bias-free normalization
  # layernorm_bias: false              # Bias-free LayerNorm

  # Position embeddings
  use_abs_pos_emb: false             # No absolute positions (using RoPE)
  tie_embedding: false               # Don't tie input/output embeddings

# ============================================================================
# Training Configuration
# ============================================================================
train_steps: 15000
accum_count: [1]                     # Gradient accumulation (effective batch = 4 * 32 = 128)
batch_size: 128                      # Per-GPU batch size
batch_type: sents                    # Batch by sentences
queue_size: 120
# normalization: tokens                # Normalize gradients by token count
valid_batch_size: 16                 # Validation batch size
valid_steps: 1500                    # Validation frequency
valid_metrics: [bleu]                # Validation metrics
save_checkpoint_steps: 3000          # Checkpoint frequency
keep_checkpoint: 5                   # Keep last 5 checkpoints

# ============================================================================
# Optimizer Settings - AdamW with warmup
# ============================================================================
optim: adamw
learning_rate: 8e-4              # Peak learning rate
adam_beta1: 0.9
adam_beta2: 0.999
weight_decay: 0.01                   # Weight decay for regularization
max_grad_norm: 1.0                   # Gradient clipping

# Learning rate scheduling
warmup_steps: 3000                   
decay_method: linear_warmup          # Linear warmup + cosine decay
learning_rate_decay: 1.0             # Full decay after warmup
start_decay_steps: 7500              # Start decay after warmup

# ============================================================================
# Distributed Training (Single GPU)
# ============================================================================
world_size: 1
gpu_ranks: [0]
node_rank: 0
task_distribution_strategy: weighted_sampling

# ============================================================================
# Logging and Monitoring
# ============================================================================
log_model_structure: false           # Log model structure at startup
report_every: 100                    # Report every 100 steps
report_training_accuracy: true       # Report training accuracy
tensorboard: true
tensorboard_log_dir: ./tensorboard_logs

# ============================================================================
# Miscellaneous
# ============================================================================
seed: 42                             # Random seed
reset_optim: all                     # Continue training steps and the optimizer state
label_smoothing: 0.1                 # Label smoothing


# Model saving
train_from: /scratch/project_462000964/members/wangchao/training/converted_models/modernbert/
save_model: /scratch/project_462000964/members/wangchao/training/121125/model/
